# One-click deploy config for Render (https://render.com).
# Push this repo to GitHub, then: Render Dashboard -> New -> Blueprint -> pick the repo.
services:
  - type: web
    name: darglobal-wasalt-chatbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false   # set this in the Render dashboard (secret)
      - key: OPENROUTER_MODEL
        # Auto free-router + fallbacks (comma-separated, tried in order).
        value: openrouter/free,openai/gpt-oss-120b:free,meta-llama/llama-3.3-70b-instruct:free
